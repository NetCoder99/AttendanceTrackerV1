<div id="divStudentConfirmation" hx-swap-oob="innerHTML">
    <div id="divStudentUpdateButtons" class="row mt-2">
        <div class="d-inline-block text-start" style="width: 8rem">
            <button id="btnSaveStudentUpdate"
                    type="button"
                    hx-on="SaveStudentDetails()"
                    class="btn btn-success btn-sm ">
                Save Updates
            </button>
        </div>
        <div class="d-inline-block text-start" style="width: 9rem">
            <button id="btnDeleteStudent"
                    type="button"
                    onclick="ShowDeleteStudentConfirmation()"
                    class="btn btn-success btn-sm ">
                Delete Student
            </button>
        </div>
        <div class="d-inline-block text-start" style="width: 8rem">
            <button id="btnCreateStudentBadge" type="button" class="btn btn-success btn-sm ">Create
                Badge
            </button>
        </div>
        <div class="d-inline-block text-start" style="width: 12rem">
            <button id="btnCreateStudentBadgeBattoDo" type="button" class="btn btn-success btn-sm ">Create
                Batto-Do Badge
            </button>
        </div>
    </div>



    <div id="divStudentMessages"
         class="fw-bold {{ messageClass }}"
         hx-swap-oob="innerHTML">
         {{ studentMessage | default('Awaiting input ...')|safe}}
    </div>
</div>
