<div id="modal_rank_required" class="modal p-3" hx-ext="debug">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <h4 id="studentGreeting" class="fw-bold mb-2 mt-1 text-center ">Add new attendance record.</h4>

            <form id="frm_required_rank"
                  hx-post="/update_attendance_record"
                  hx-target="#attendance_update_message"
                  hx-swap="innerHTML"
                  class="mb-4 p-4">
                <input type="hidden" name="badge_number" value="{{ badge_number }}"/>
                <div class="mb-3">
                    <label for="frm_checkinDateTime" class="form-label">Checkin Date</label>
                    <input
                        type="datetime-local"
                        class="form-control d-inline-block w-75"
                        id="frm_checkinDateTime"
                        name="frm_checkinDateTime"
                        value="2026-07-14T17:00"
                        required>
                    <img
                        src="static/images/icons/search-icon.svg"
                        class="d-inline-block hover-pointer"
                        alt="Search"
                        hx-get="/get_attendance_class"
                        hx-trigger="click"
                        hx-include="#frm_checkinDateTime"
                        hx-target="#div_class_details"
                        hx-on:htmx:after-request="alert('Request finished!')"
                        height={24}
                    />
                </div>

                <div id="div_class_details" name="div_class_details" class="mb-3 d-inline-block">
                    <table id="classTable" class="table table-bordered table-striped" >
                      <thead>
                        <tr>
                          <th>Day of Week</th>
                          <th>Class Name</th>
                          <th>Start Time</th>
                          <th>End Time</th>
                       </tr>
                      </thead>
                      <tbody id="tbodyClassDays">
                        <tr>
                          <td id="td_ClassDayName"   class="fw-bold"></td>
                          <td id="td_ClassName"      class="fw-bold"></td>
                          <td id="td_ClassStartTime" class="fw-bold"></td>
                          <td id="td_ClassFinisTime" class="fw-bold"></td>
                        </tr>
                      </tbody>
                    </table>
                </div>

                <div id="div_attendance_messages" name="div_attendance_messages" class="mb-3 d-inline-block" hx-oob-swap="true">
                    <h5 id="attendance_update_message" class="text-success fw-bold text-center mb-3">Awaiting input ...</h5>
                </div>

            </form>
        </div>
    </div>
</div>
